<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/staff/assets/staff.css">
</head>
<body>
    <div class="sp-wave-bg" id="loginPage">
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <clipPath id="waveClip" clipPathUnits="objectBoundingBox">
                <path d="M0,0.4 C0.05,0.5 0.1,0.3 0.15,0.4 C0.2,0.5 0.25,0.25 0.3,0.4 C0.35,0.55 0.4,0.3 0.45,0.45 C0.5,0.6 0.55,0.35 0.6,0.5 C0.65,0.65 0.7,0.4 0.75,0.55 C0.8,0.7 0.85,0.45 0.9,0.6 C0.95,0.75 1,0.4 1,0.4 L1,1 L0,1 Z" />
            </clipPath>
        </defs>
    </svg>
    <div class="sp-login-box">
        <div class="sp-login-logo">
            <span class="sp-star"></span>
            <h1>Staff Panel</h1>
            <p>Are you <i>supposed</i> to be here?</p>
        </div>
        <form id="loginForm">
            <div id="errorMsg" class="sp-error"></div>
            <div class="sp-field">
                <label for="username">Username</label>
                <input class="sp-field-input" type="text" id="username" autocomplete="username" required placeholder="Your username">
            </div>
            <div class="sp-field">
                <label for="password">Password</label>
                <input class="sp-field-input" type="password" id="password" autocomplete="current-password" required placeholder="Your password">
            </div>
            <button type="submit" id="submitBtn" class="sp-btn sp-btn-primary sp-login-submit">Sign In</button>
        </form>
    </div>
</div>
<script>
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.remove('show');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in';
        try {
            const res = await fetch('/staff/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                }),
            });
            const data = await res.json();
            if (res.ok) {
                window.location.href = '/staff/home';
            } else {
                errorEl.textContent = data.error || 'Login failed.';
                errorEl.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        } catch {
            errorEl.textContent = 'A network error occurred. Please try again.';
            errorEl.classList.add('show');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
        }
    });
</script>
</body>
</html>
